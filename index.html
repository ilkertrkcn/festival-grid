<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6 Büyük Festival — Yönetmenler 2000–2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream:#faf8f4; --ink:#1a1814; --muted:#7a7060;
  --border:rgba(26,24,20,.10); --border-s:rgba(26,24,20,.18);
  --cannes:#1a6bbf;    --cannes-bg:#e6f1fb; --cannes-light:#d0e8f8; --cannes-dark:#0c447c;
  --venice:#c0392b;    --venice-bg:#fdf0ee; --venice-light:#fad8d4; --venice-dark:#7b1a10;
  --berlin:#2e9e4f;    --berlin-bg:#e8f8ed; --berlin-light:#c6efd4; --berlin-dark:#155a28;
  --sundance:#d4680a;  --sundance-bg:#fde3c0; --sundance-light:#fad8b4; --sundance-dark:#8a3c00;
  --toronto:#7b5ea7;   --toronto-bg:#f3eefe; --toronto-light:#e0d4f8; --toronto-dark:#4a2d7a;
  --oscar:#b8860b;     --oscar-bg:#fde87a;   --oscar-light:#faefc0;   --oscar-dark:#6b5000;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}

/* ─── Header ─── */
header{
  background:#1a2f4e;color:#fff;
  padding:24px 40px 20px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  position:sticky;top:0;z-index:100;border-bottom:2px solid #c9a84c;
}
.hl{display:flex;flex-direction:column;gap:3px}
.heyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#f0d28a;opacity:.8}
h1{font-family:'Playfair Display',serif;font-size:24px;font-weight:600;color:#fff;line-height:1.15}
h1 em{font-style:italic;color:#f0d28a}
.hsub{font-size:11px;color:rgba(255,255,255,.4);font-weight:300}

/* ─── Controls ─── */
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl input,.ctrl select{
  font-family:'DM Sans',sans-serif;font-size:12px;padding:6px 10px;
  border-radius:6px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);color:#fff;outline:none;
}
.ctrl select option{background:#1a2f4e;color:#fff}
.ctrl input::placeholder{color:rgba(255,255,255,.35)}
.ctrl input:focus,.ctrl select:focus{border-color:#c9a84c}
.fbtn{
  font-family:'DM Sans',sans-serif;font-size:11px;padding:5px 10px;
  border-radius:20px;border:1px solid rgba(255,255,255,.22);
  background:transparent;color:rgba(255,255,255,.65);cursor:pointer;transition:all .15s;white-space:nowrap;
}
.fbtn:hover{border-color:#c9a84c;color:#f0d28a}
.fbtn.on{background:#c9a84c;border-color:#c9a84c;color:#1a2f4e;font-weight:500}
.stat{font-size:10px;color:rgba(255,255,255,.3);font-weight:300}

/* ─── Festival tab pills ─── */
.fest-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 40px 0}
.ftab{
  font-size:11px;font-weight:500;padding:5px 12px;border-radius:20px;cursor:pointer;
  transition:all .15s;border:1.5px solid transparent;display:flex;align-items:center;gap:5px;
}
.ftab svg{width:12px;height:12px;flex-shrink:0}
.ftab.off{opacity:.38;filter:grayscale(.7)}
.ftab[data-f="cannes"]   {background:var(--cannes-bg);color:var(--cannes-dark);border-color:var(--cannes)}
.ftab[data-f="venice"]   {background:var(--venice-bg);color:var(--venice-dark);border-color:var(--venice)}
.ftab[data-f="berlin"]   {background:var(--berlin-bg);color:var(--berlin-dark);border-color:var(--berlin)}
.ftab[data-f="sundance"] {background:var(--sundance-bg);color:var(--sundance-dark);border-color:var(--sundance)}
.ftab[data-f="toronto"]  {background:var(--toronto-bg);color:var(--toronto-dark);border-color:var(--toronto)}
.ftab[data-f="oscar"]    {background:var(--oscar-bg);color:var(--oscar-dark);border-color:var(--oscar)}

/* ─── Grid scroll ─── */
.gs-wrap{display:flex;flex-direction:column;gap:0}
.gs-top{overflow-x:auto;overflow-y:hidden;height:8px;padding:0 40px}
.gs-top-inner{height:1px}
.gs-top::-webkit-scrollbar{height:4px}
.gs-top::-webkit-scrollbar-thumb{background:var(--border-s);border-radius:2px}
.gs{overflow-x:auto;padding:12px 40px 40px}
.gs::-webkit-scrollbar{height:4px}
.gs::-webkit-scrollbar-thumb{background:var(--border-s);border-radius:2px}

/* ─── Table ─── */
table{border-collapse:collapse;table-layout:fixed}
.nth,.ntd{position:sticky;left:0;z-index:10;background:var(--cream)}
.nth{
  width:190px;min-width:190px;padding:12px 12px 8px 0;
  font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--border-s);vertical-align:bottom;
}
.yth{
  width:72px;min-width:72px;padding:12px 3px 8px;
  font-size:10px;text-align:center;vertical-align:bottom;
  border-bottom:1px solid var(--border-s);color:var(--muted);white-space:nowrap;
}
.yth.sel{color:#1a2f4e;font-weight:700;font-size:11px;border-bottom:2px solid #c9a84c}
.yth.hf{color:var(--ink)}
.ntd{
  width:190px;min-width:190px;padding:3px 12px 3px 0;
  vertical-align:middle;border-top:1px solid var(--border);
}
.di{padding:3px 0}
.dn{font-size:11px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:184px}
.dc{font-size:10px;color:var(--muted);font-weight:300}
.cell{
  width:72px;min-width:72px;
  border-left:1px solid var(--border);border-top:1px solid var(--border);
  vertical-align:middle;text-align:center;padding:2px;
}
.cell.csel{background:rgba(201,168,76,.05)}
tr:hover .cell{background:rgba(26,24,20,.02)}
tr:hover .cell.csel{background:rgba(201,168,76,.09)}
tr:hover .ntd{background:rgba(26,24,20,.02)}

/* ─── Multi-festival Pill ─── */
.pill{
  position:relative;
  display:flex;flex-direction:column;align-items:stretch;
  width:68px;min-height:44px;border-radius:6px;
  overflow:hidden;cursor:default;
  transition:transform .12s,box-shadow .12s;
  border:1px solid transparent;
}
.pill:hover{transform:scale(1.12);box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:60;overflow:visible}

/* Festival stripes — horizontal bands */
.pstripe{
  flex:1;display:flex;align-items:center;justify-content:center;
  min-height:14px;position:relative;
}

/* Single stripe pill — show name + rating */
.pill.single .pstripe{flex-direction:column;gap:1px;min-height:44px}
.pname{font-size:7.5px;line-height:1.2;text-align:center;width:100%;padding:0 2px;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.prating{font-size:8px;font-weight:600;opacity:.88}

/* Multi stripe: just a colored band */
.pstripe-label{
  font-size:7px;font-weight:500;letter-spacing:.03em;opacity:.8;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px;
}

/* Award icons row — right side of pill */
.pawards{
  position:absolute;top:2px;right:2px;
  display:flex;flex-direction:column;gap:1px;z-index:2;
}
.pawards svg{width:10px;height:10px}

/* Border system for awards */
.pill.has-main{border-width:2px}
.pill.no-award{border-width:1px;opacity:.82}

/* Festival stripe colors */
.ps-cannes  {background:var(--cannes-bg)}
.ps-venice  {background:var(--venice-bg)}
.ps-berlin  {background:var(--berlin-bg)}
.ps-sundance{background:var(--sundance-bg)}
.ps-toronto {background:var(--toronto-bg)}
.ps-oscar   {background:var(--oscar-bg)}

/* Text colors per festival */
.ps-cannes   .pname,.ps-cannes   .prating,.ps-cannes   .pstripe-label{color:var(--cannes-dark)}
.ps-venice   .pname,.ps-venice   .prating,.ps-venice   .pstripe-label{color:var(--venice-dark)}
.ps-berlin   .pname,.ps-berlin   .prating,.ps-berlin   .pstripe-label{color:var(--berlin-dark)}
.ps-sundance .pname,.ps-sundance .prating,.ps-sundance .pstripe-label{color:var(--sundance-dark)}
.ps-toronto  .pname,.ps-toronto  .prating,.ps-toronto  .pstripe-label{color:var(--toronto-dark)}
.ps-oscar    .pname,.ps-oscar    .prating,.ps-oscar    .pstripe-label{color:var(--oscar-dark)}

/* Multi-stripe pill border = gradient of festival colors (CSS trick via box-shadow) */
.pill.multi-f{border:none;box-shadow:0 0 0 1.5px #ccc}
.pill.multi-f.has-main{box-shadow:0 0 0 2.5px #888}

/* ─── Tooltip ─── */
.tip{
  display:none;position:absolute;bottom:calc(100%+6px);left:50%;transform:translateX(-50%);
  background:#1a2f4e;color:#fff;border-radius:8px;padding:9px 11px;
  width:200px;font-size:11px;line-height:1.55;z-index:300;
  pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.22);
}
.tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:#1a2f4e}
.pill:hover .tip{display:block}
.tip .tt{font-family:'Playfair Display',serif;font-size:12px;margin-bottom:4px;color:#fff}
.tip .tv{color:rgba(255,255,255,.55);font-size:10px}
.tip .tf{font-size:10px;margin-top:2px;padding:2px 0;border-top:1px solid rgba(255,255,255,.1)}
.tip .tf-name{font-weight:500;color:#c9a84c}
.tip .tf-award{color:#f0d28a;font-size:9.5px}
.tip .tf-sel{color:rgba(255,255,255,.45);font-size:9.5px}

/* ─── Legend ─── */
.legend{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:12px 40px;border-top:1px solid var(--border);
}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.ls{width:20px;height:11px;border-radius:4px}
.ln{font-style:italic;color:var(--muted);font-size:10px;margin-left:auto}

@media(max-width:600px){
  header{padding:16px 20px} h1{font-size:18px}
  .gs{padding:8px 16px 32px} .legend{padding:10px 16px}
  .fest-tabs{padding:8px 16px 0}
}
</style>
</head>

<header>
  <div class="hl">
    <span class="heyebrow">Cannes · Venedik · Berlin · Sundance · Toronto · Oscar</span>
    <h1>6 Büyük Festival <em>2000 – 2026</em></h1>
    <div class="hsub">Yönetmenler · adaylıklar · ödüller · IMDb puanları</div>
  </div>
  <div class="ctrl">
    <input type="text" id="sq" placeholder="Yönetmen veya film…" oninput="render()">
    <select id="yr-sel" onchange="render()"><option value="">Tüm yıllar</option></select>
    <button class="fbtn on" onclick="setF('all',this)">Tümü</button>
    <button class="fbtn" onclick="setF('main',this)">Ana ödül</button>
    <button class="fbtn" onclick="setF('high',this)">IMDb 8+</button>
    <span class="stat" id="stat"></span>
  </div>
</header>

<div class="fest-tabs" id="fest-tabs"></div>

<div class="gs-wrap">
<div class="gs-top" id="gs-top"><div class="gs-top-inner" id="gs-top-inner"></div></div>
<div class="gs" id="gs-main"><div id="grid"></div></div>
</div>

<div class="legend">
  <div class="li">
    <div class="ls" style="border:2.5px solid #888;background:linear-gradient(to right,#e6f1fb 50%,#fdf0ee 50%)"></div>
    Çoklu festival — renkli şeritler
  </div>
  <div class="li">
    <div class="ls" style="border:2px solid #888;background:#f5f3ee"></div>
    Ana ödül (kalın çerçeve + ikon)
  </div>
  <div class="li">
    <div class="ls" style="border:1px solid #bbb;background:#f5f3ee;opacity:.75"></div>
    Seçki / adaylık
  </div>
  <span class="ln">Hover ile detay · ★ IMDb</span>
</div>

// ── Deduplicate DIRS (same name) ──
const dirMap = new Map();
for(const d of DIRS){
  if(!d.films.length) continue; // skip empty duplicates
  if(dirMap.has(d.name)){
    const existing = dirMap.get(d.name);
    existing.films.push(...d.films);
  } else {
    dirMap.set(d.name, {name:d.name, nat:d.nat, films:[...d.films]});
  }
}
const DIRS_CLEAN = Array.from(dirMap.values());

const ALLYEARS=[];
for(let y=2026;y>=2000;y--) ALLYEARS.push(y);

/* ── State ── */
let activeFests=new Set(['cannes','venice','berlin','sundance','toronto','oscar']);
let fmode='all';

/* ── Build year select ── */
const selEl=document.getElementById('yr-sel');
ALLYEARS.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y;selEl.appendChild(o);});

/* ── Build festival tabs ── */
const tabsEl=document.getElementById('fest-tabs');
Object.entries(FESTS).forEach(([k,v])=>{
  const t=document.createElement('div');
  t.className='ftab';t.dataset.f=k;
  t.innerHTML=`<svg viewBox="0 0 20 20" fill="${v.dark}">${ICONS[k].replace(/<svg[^>]*>/,'').replace('</svg>','')}</svg><span>${v.name}</span>`;
  t.onclick=()=>{
    if(activeFests.has(k)){if(activeFests.size>1){activeFests.delete(k);t.classList.add('off');}}
    else{activeFests.add(k);t.classList.remove('off');}
    render();
  };
  tabsEl.appendChild(t);
});

function setF(m,btn){fmode=m;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');render();}

/* Get CSS color var for festival */
const FEST_COLORS={
  cannes:'#1a6bbf', venice:'#c0392b', berlin:'#2e9e4f',
  sundance:'#d4680a', toronto:'#7b5ea7', oscar:'#b8860b'
};
const FEST_DARK={
  cannes:'#0c447c', venice:'#7b1a10', berlin:'#155a28',
  sundance:'#8a3c00', toronto:'#4a2d7a', oscar:'#6b5000'
};
const FEST_BG={
  cannes:'#e6f1fb', venice:'#fdf0ee', berlin:'#e8f8ed',
  sundance:'#fde3c0', toronto:'#f3eefe', oscar:'#fde87a'
};

function buildPill(filmEntry, activeFestsSet){
  const activeFestList = filmEntry.fests.filter(fe => activeFestsSet.has(fe.f));
  if(!activeFestList.length) return '';

  const title = filmEntry.t;
  const rating = filmEntry.r;
  const year = filmEntry.y;
  const shortTitle = title.length > 14 ? title.substring(0,13)+'…' : title;

  const hasMain = activeFestList.some(fe => fe.main);
  const hasAward = activeFestList.some(fe => fe.a && !fe.main);
  const isMulti = activeFestList.length > 1;

  // Border style — üç kademe
  let borderStyle = '';
  if(hasMain){
    borderStyle = `border:3px solid #d4a017;box-shadow:0 0 0 1px #d4a01755`;
  } else if(hasAward){
    borderStyle = `border:2px solid #909090`;
  } else {
    borderStyle = `border:1px solid rgba(0,0,0,.12);opacity:0.78`;
  }

  // Top: name + rating — açık zemin
  const topBand = `<div style="padding:3px 4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;background:#edeae2">
    <span style="font-size:7.5px;font-weight:500;color:#1a1814;line-height:1.2;text-align:center;width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${shortTitle}</span>
    ${rating ? `<span style="font-size:8px;font-weight:600;color:#5a4a20">★${rating.toFixed(1)}</span>` : ''}
  </div>`;

  // Bottom: festival segments side by side
  const segments = activeFestList.map(fe => {
    const icoHtml = fe.main
      ? `<span style="color:${FEST_COLORS[fe.f]};display:flex;align-items:center;justify-content:center">${ICONS[fe.f].replace('<svg','<svg width="12" height="12"')}</span>`
      : '';
    return `<div style="flex:1;background:${FEST_BG[fe.f]};min-height:18px;display:flex;align-items:center;justify-content:center;border-left:${fe===activeFestList[0]?'none':'1px solid rgba(0,0,0,.06)'}">${icoHtml}</div>`;
  }).join('');

  const bottomRow = `<div style="display:flex;border-top:1px solid rgba(0,0,0,.07)">${segments}</div>`;

  // Tooltip
  const festLines = filmEntry.fests.map(fe => {
    if(!activeFestsSet.has(fe.f)) return '';
    const awardLine = fe.a ? `<div class="tf-award">🏆 ${fe.a}</div>` : `<div class="tf-sel">Seçki</div>`;
    return `<div class="tf"><span class="tf-name">${FESTS[fe.f].name}</span>${awardLine}</div>`;
  }).filter(Boolean).join('');

  return `<div class="pill ${hasMain?'has-main':'no-award'}" style="${borderStyle}">
    ${topBand}
    ${bottomRow}
    <div class="tip">
      <div class="tt">${title}</div>
      <div class="tv">${year}${rating?` · ★ ${rating.toFixed(1)}`:''}</div>
      ${festLines}
    </div>
  </div>`;
}

function render(){
  const q=document.getElementById('sq').value.toLowerCase().trim();
  const selY=parseInt(document.getElementById('yr-sel').value)||null;

  let dirs=DIRS_CLEAN.filter(d=>{
    // must have at least one film in an active festival
    const hasFest=d.films.some(f=>f.fests.some(fe=>activeFests.has(fe.f)));
    if(!hasFest) return false;
    if(selY){
      const inYear=d.films.some(f=>f.y===selY && f.fests.some(fe=>activeFests.has(fe.f)));
      if(!inYear) return false;
    }
    if(fmode==='main' && !d.films.some(f=>f.fests.some(fe=>fe.main && activeFests.has(fe.f)))) return false;
    if(fmode==='high' && !d.films.some(f=>f.r && f.r>=8.0)) return false;
    if(q && !d.name.toLowerCase().includes(q) && !d.films.some(f=>f.t.toLowerCase().includes(q))) return false;
    return true;
  });

  // Sort: 3 kademe
  // Ana ödül (main:1): ilk 1.0, aynı filmden ek her biri +0.4
  // Diğer ödül (a var, main yok): ilk 0.5, ek +0.25
  // Seçki (a yok): 0.2
  const dirScore = d => {
    let total = 0;
    d.films.forEach(f => {
      const active = f.fests.filter(fe => activeFests.has(fe.f));
      const mains  = active.filter(fe => fe.main).length;
      const others = active.filter(fe => !fe.main && fe.a).length;
      const sels   = active.filter(fe => !fe.main && !fe.a).length;
      if(mains  > 0) total += 1.0 + (mains  - 1) * 0.4;
      if(others > 0) total += 0.5 + (others - 1) * 0.25;
      total += sels * 0.2;
    });
    return total;
  };
  dirs.sort((a, b) => dirScore(b) - dirScore(a));

  const usedSet=new Set();
  dirs.forEach(d=>d.films.forEach(f=>{if(f.y>=2000 && f.fests.some(fe=>activeFests.has(fe.f)))usedSet.add(f.y);}));
  const years=ALLYEARS.filter(y=>usedSet.has(y));

  document.getElementById('stat').textContent=`${dirs.length} yönetmen · ${years.length} yıl`;

  // Group films by dir+year
  let html=`<table><thead><tr><th class="nth">Yönetmen</th>`;
  years.forEach(y=>html+=`<th class="yth ${y===selY?'sel':'hf'}">${y}</th>`);
  html+=`</tr></thead><tbody>`;

  dirs.forEach(d=>{
    const byYear={};
    d.films.forEach(f=>{
      if(!f.fests.some(fe=>activeFests.has(fe.f))) return;
      if(!byYear[f.y]) byYear[f.y]=[];
      byYear[f.y].push(f);
    });

    html+=`<tr><td class="ntd"><div class="di"><div class="dn">${d.name}</div><div class="dc">${d.nat}</div></div></td>`;
    years.forEach(y=>{
      html+=`<td class="cell${y===selY?' csel':''}">`;
      const films=byYear[y]||[];
      films.forEach(f=>{
        html+=buildPill(f, activeFests);
      });
      html+=`</td>`;
    });
    html+=`</tr>`;
  });

  html+=`</tbody></table>`;
  if(!dirs.length) html=`<div style="padding:48px;text-align:center;color:var(--muted);font-style:italic">Sonuç bulunamadı.</div>`;
  // Üst scrollbar genişliğini güncelle
  const table = document.querySelector('#gs-main table');
  if(table) document.getElementById('gs-top-inner').style.width = table.offsetWidth + 'px';
  document.getElementById('grid').innerHTML=html;
  setTimeout(()=>{
    const t = document.querySelector('#gs-main table');
    if(t) document.getElementById('gs-top-inner').style.width = t.offsetWidth + 'px';
  }, 0);
}

render();

// Üst ve alt scrollbar senkronizasyonu

gsTop.addEventListener('scroll', () => { gsMain.scrollLeft = gsTop.scrollLeft; });
gsMain.addEventListener('scroll', () => { gsTop.scrollLeft = gsMain.scrollLeft; });
</script>
